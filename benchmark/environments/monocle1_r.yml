name: monocle1_bioc30_linux_legacy
channels:
  - conda-forge
dependencies:
  # Historical specification. It must be created on Linux; current Windows
  # conda channels do not provide this old, internally consistent stack.
  - r-base=3.1
  - r-essentials
  - pip
# After creation, install Bioconductor 3.0 packages and the archived source:
# https://ftp.gwdg.de/pub/misc/bioconductor/packages/3.0/bioc/src/contrib/monocle_1.0.0.tar.gz
# Required historical packages include HSMMSingleCell, Biobase, VGAM, igraph,
# fastICA, irlba, limma, matrixStats, plyr, reshape2, and combinat.

